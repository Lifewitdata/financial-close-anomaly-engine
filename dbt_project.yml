name: 'financial_close_anomaly_engine'
version: '1.0.0'
config-version: 2
profile: 'financial_close_anomaly_engine'
require-dbt-version: [">=1.8.0", "<2.0.0"]
model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages", "logs"]
models:
  financial_close_anomaly_engine:
    staging:
      +materialized: view
      +schema: bronze
    intermediate:
      +materialized: view
      +schema: silver
    marts:
      +materialized: table
      +schema: gold
seeds:
  financial_close_anomaly_engine:
    +schema: raw
snapshots:
  financial_close_anomaly_engine:
    +schema: gold_scd
    +tags: scd2_history
